[package]
name = "workspace-validator"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "MIT"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.5"
schemars = { version = "1.2", features = ["derive"] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
wait-timeout = "0.2"

[dev-dependencies]
tempfile = "3.27"
