[package]
name = "knowledge-builder"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
description = "Deterministic offline compiler for canonical veterinary knowledge"
license = "MIT"

[lib]
name = "knowledge_builder"
path = "src/lib.rs"

[[bin]]
name = "knowledge-builder"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled", "modern_sqlite"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
