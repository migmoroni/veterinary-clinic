[package]
name = "knowledge-builder"
version = "0.4.0"
edition = "2021"
rust-version = "1.87"
description = "Deterministic offline compiler for canonical veterinary knowledge"
license = "MIT"

[lib]
name = "knowledge_builder"
path = "src/lib.rs"

[[bin]]
name = "knowledge-builder"
path = "src/main.rs"

[dependencies]
comrak = { version = "=0.35.0", default-features = false }
image = { version = "=0.25.5", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
jsonschema = { version = "=0.26.2", default-features = false }
rusqlite = { version = "0.32", features = ["bundled", "modern_sqlite"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
unicode-normalization = "=0.1.24"
