[package]
name = "veterinary_clinic"
version = "0.2.0"
description = "Local-first veterinary clinic app"
authors = ["Miguel Eduardo Senna Moroni"]
license = "MIT"
homepage = "https://github.com/migmoroni/veterinary-clinic"
repository = "https://github.com/migmoroni/veterinary-clinic"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "veterinary_clinic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.1", features = [] }
vet-engine = { path = "../../../packages/engine" }
sha2 = "0.10.9"
rusqlite = { version = "0.32", features = ["bundled", "modern_sqlite", "session"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
