[package]
name = "vet-engine"
version = "0.2.0"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "vet_engine"
path = "src/lib.rs"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.1", features = [] }
sha2 = "0.10.9"
rusqlite = { version = "0.32", features = ["bundled", "modern_sqlite", "session"] }
